name: Render postmortem draft

on:
  pull_request:
    paths:
      - "drafts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-render-postmortem-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Render each changed draft
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git check-ref-format --branch "$BASE_REF" >/dev/null
          git fetch origin "$BASE_REF"
          while IFS= read -r -d '' file; do
            echo "Rendering $file"
            node scripts/render-draft.mjs "$file"
          done < <(git diff --name-only -z "origin/$BASE_REF...HEAD" -- 'drafts/*.md')

      - name: Commit rendered output, only if anything actually changed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "atlas-blackbox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add postmortems/
          if git diff --cached --quiet; then
            echo "Nothing to commit, converter output already up to date."
          else
            git check-ref-format --branch "$HEAD_REF" >/dev/null
            git commit -m "Auto-render postmortem draft [skip ci]"
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
