name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: AtlasReaper311/atlas-infra/.github/workflows/deploy-worker.yml@f971172dc258c93dffa53b8b7a3532c5be55883d # atlas-infra W3 Worker contract enforcement
    with:
      worker_name: atlas-blackbox
      wrangler_version: "4.120.0"
      run_lint: true
      require_meta: true
    secrets: inherit

  verify-production:
    name: Verify published postmortems
    needs: deploy
    if: github.ref_name == 'main' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployed repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Verify committed postmortems are live
        env:
          EXPECTED_BLACKBOX_VERSION: "1.0.2"
        run: node scripts/verify-published-postmortems.mjs
